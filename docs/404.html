<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Iddico Guest House | Redirecting...</title>
    <script>
      // Single Page Application redirect script for GitHub Pages
      // Ensures direct links, subpaths, and reloads on GitHub Pages redirect back to index.html with correct route
      (function() {
        var pathSegmentsToKeep = 1; // Set to 1 if repo is hosted at https://<username>.github.io/<repo-name>/
        var l = window.location;
        
        // If hosted on a custom domain or root, keep 0 segments; if under /<repo>/, keep 1
        var isGitHubPages = l.hostname.indexOf('github.io') !== -1;
        var segments = isGitHubPages ? 1 : 0;
        
        var targetUrl = l.protocol + '//' + l.host +
          l.pathname.split('/').slice(0, 1 + segments).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(segments).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash;
          
        l.replace(targetUrl);
      })();
    </script>
  </head>
  <body style="font-family: system-ui, -apple-system, sans-serif; background: #1c1917; color: #f5f5f4; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 1.5rem; text-align: center;">
    <div>
      <h1 style="color: #f59e0b; margin-bottom: 0.5rem; font-size: 1.5rem;">Iddico Guest House</h1>
      <p style="color: #a8a29e; font-size: 0.9rem; margin-bottom: 1.5rem;">Redirecting to reservation portal...</p>
      <a href="./" style="display: inline-block; padding: 0.6rem 1.25rem; background: #d97706; color: #1c1917; text-decoration: none; border-radius: 0.75rem; font-weight: bold; font-size: 0.85rem;">
        Click here if not redirected automatically
      </a>
    </div>
  </body>
</html>
