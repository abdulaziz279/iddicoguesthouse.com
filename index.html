<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iddico Guest House | Affordable Serenity & Boutique Stay in Ghana</title>
    <meta name="description" content="Experience serene comfort at Iddico Guest House. Book our Standard (GHS 100) or Deluxe Suite (GHS 170) with 24/7 reception, free Wi-Fi, MoMo payments, and local tours." />
    <meta property="og:title" content="Iddico Guest House | Ghana Hospitality" />
    <meta property="og:description" content="Book affordable boutique rooms in Ghana Cedis. 24/7 front desk, high-speed Wi-Fi, relaxation gardens, and easy online reservation." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d97706'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-family='serif' font-weight='bold' font-size='18' fill='%231c1917'%3EI%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
    
    <!-- Production stylesheet fallback for direct static deployments -->
    <link rel="stylesheet" crossorigin href="./assets/index.css">

    <!-- GitHub Pages Trailing-Slash & SPA Path Normalizer -->
    <script>
      (function() {
        // 1. Ensure trailing slash for repository directories on GitHub Pages so relative assets resolve properly
        var path = window.location.pathname;
        if (path && !path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.location.replace(window.location.protocol + '//' + window.location.host + path + '/' + window.location.search + window.location.hash);
          return;
        }

        // 2. Decode SPA redirect query from 404.html if redirected on GitHub Pages
        var search = window.location.search;
        if (search && search.indexOf('?/') === 0) {
          var decoded = search.slice(2).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          var basePath = window.location.pathname.endsWith('/') ? window.location.pathname.slice(0, -1) : window.location.pathname;
          var newPath = basePath + (decoded.charAt(0) === '/' ? decoded : '/' + decoded) + window.location.hash;
          window.history.replaceState(null, null, newPath);
        }
      })();
    </script>

    <!-- Paystack Africa Payments Integration (Ghana GHS - MoMo & Cards) loaded non-blocking -->
    <script src="https://js.paystack.co/v1/inline.js" async defer></script>
  </head>
  <body class="bg-stone-900 text-stone-100 antialiased selection:bg-amber-500 selection:text-stone-950">
    <!-- App Root with Initial Branded Loading Skeleton (instant mount replaces this) -->
    <div id="root">
      <div style="min-height: 100vh; background-color: #1c1917; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif; color: #f5f5f4; padding: 1.5rem; text-align: center;">
        <div style="width: 56px; height: 56px; border-radius: 1rem; background: rgba(217, 119, 6, 0.15); border: 1px solid rgba(217, 119, 6, 0.4); display: flex; align-items: center; justify-content: center; margin-bottom: 1rem;">
          <span style="font-size: 24px; font-weight: bold; color: #f59e0b; font-family: serif;">I</span>
        </div>
        <h1 style="font-size: 1.25rem; font-weight: 700; margin: 0 0 0.5rem 0; color: #ffffff;">Iddico Guest House</h1>
        <p style="font-size: 0.85rem; color: #a8a29e; margin: 0 0 1.25rem 0; max-width: 320px;">Loading boutique accommodations, rooms & booking schedule...</p>
        <div style="width: 32px; height: 32px; border: 3px solid rgba(217, 119, 6, 0.2); border-top-color: #f59e0b; border-radius: 50%; animation: iddico-spin 0.8s linear infinite;"></div>
        <style>
          @keyframes iddico-spin {
            to { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>

    <!-- Noscript Fallback -->
    <noscript>
      <div style="font-family: system-ui, -apple-system, sans-serif; padding: 3rem; text-align: center; background: #1c1917; color: #f5f5f4; min-height: 100vh;">
        <h1 style="color: #f59e0b; margin-bottom: 1rem;">Iddico Guest House</h1>
        <p>Please enable JavaScript in your browser to view and reserve rooms at Iddico Guest House.</p>
      </div>
    </noscript>

    <!-- Development entry point for Vite dev server -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Automatic Static Host Fallback for GitHub Pages Root Deployments -->
    <script>
      (function() {
        var isDevServer = window.location.hostname === 'localhost' || 
                          window.location.hostname === '127.0.0.1' || 
                          window.location.port === '3000' ||
                          window.location.hostname.indexOf('run.app') !== -1;

        if (!isDevServer && !document.querySelector('script[src*="assets/index.js"]')) {
          // Dynamically load the production bundle on static hosts like GitHub Pages
          var s = document.createElement('script');
          s.type = 'module';
          s.crossOrigin = '';
          s.src = './assets/index.js';
          s.onerror = function() {
            var s2 = document.createElement('script');
            s2.type = 'module';
            s2.crossOrigin = '';
            s2.src = './dist/assets/index.js';
            document.body.appendChild(s2);
          };
          document.body.appendChild(s);
        }
      })();
    </script>
  </body>
</html>
